    <text x="10" y="18" fill="#3fb950" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">🧊 PYTHON • SSE &amp; DLP</text>
    <text x="10" y="34" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Stream Framing &amp; ISO-4217</text>
  </g>

