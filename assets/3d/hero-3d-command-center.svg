  <g transform="translate(658, 46)">
    <polygon points="28,0 56,14 28,28 0,14" fill="#5ce1ff" stroke="#00ADD8" stroke-width="1"/>
    <polygon points="0,14 28,28 28,58 0,44" fill="#00ADD8" stroke="#00ADD8" stroke-width="1"/>
