    <line x1="220" y1="225" x2="508" y2="75"/>
    <line x1="320" y1="225" x2="568" y2="95"/>
    <line x1="420" y1="225" x2="628" y2="115"/>
    <line x1="776" y1="225" x2="448" y2="55"/>
    <line x1="676" y1="225" x2="388" y2="75"/>
