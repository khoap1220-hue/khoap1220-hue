    <path id="pathGo" d="M686 72 L448 118" stroke="#00ADD8" stroke-opacity="0.45" stroke-dasharray="5 4"/>
    <path id="pathTs" d="M210 170 L448 118" stroke="#3178c6" stroke-opacity="0.45" stroke-dasharray="5 4"/>
    <path id="pathPy" d="M686 170 L448 118" stroke="#3fb950" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  </g>

